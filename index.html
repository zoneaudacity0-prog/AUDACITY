<script>
/* ============================
   Utilities & parsing helpers
   ============================ */

function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }

function cleanNumeric(v){
  if(v===null||v===undefined) return 0;
  let s = String(v);
  // remove common currency text
  s = s.replace(/TZS|Tsh|TZS\.|KES|UGX|USD/gi,'');
  // parentheses => negative
  if(/\(.+\)/.test(s)){ s = '-' + s.replace(/[()]/g,''); }
  // remove non-digit except dot and minus
  s = s.replace(/[^\d\.\-\,]/g,'').trim();
  // fix commas/spaces
  s = s.replace(/,/g,'').replace(/\s/g,'');
  // multiple dots -> keep last as decimal
  const dots = (s.match(/\./g)||[]).length;
  if(dots>1){
    const parts = s.split('.');
    const last = parts.pop();
    s = parts.join('') + '.' + last;
  }
  const n = parseFloat(s);
  return isNaN(n)?0:n;
}

function tryParseDate(val){
  if(!val && val!==0) return null;
  if(val instanceof Date && !isNaN(val)) return val;
  const s = String(val).trim();
  if(!s) return null;
  // common normalizations
  const cleaned = s.replace(/\./g,'-').replace(/\//g,'-').replace(/\s+/g,' ').trim();
  // try ISO first
  const iso = cleaned.match(/^\d{4}[-]\d{1,2}[-]\d{1,2}/);
  if(iso){
    const d = new Date(cleaned);
    if(!isNaN(d)) return d;
  }
  // dd-mm-yyyy or dd mmm yyyy
  const dmy = cleaned.match(/(\d{1,2})[- ]([A-Za-z]{3,9}|\d{1,2})[- ](\d{2,4})/);
  if(dmy){
    const tryDate = new Date(cleaned);
    if(!isNaN(tryDate)) return tryDate;
    // manual parsing when month is word
    const day = parseInt(dmy[1],10);
    let mon = dmy[2];
    let year = parseInt(dmy[3],10);
    if(year < 100) year += 2000;
    let mm = parseInt(mon,10);
    if(isNaN(mm)){
      const mnames = {jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,sept:8,oct:9,nov:10,dec:11};
      mm = mnames[mon.toLowerCase().substring(0,3)];
    } else mm = mm-1;
    if(!isNaN(mm)) return new Date(year, mm, day);
  }
  // last resort Date parse
  const last = new Date(cleaned);
  if(!isNaN(last)) return last;
  return null;
}

/* ============================
   PDF extraction with pdf.js + OCR fallback
   ============================ */

async function extractTextFromPDF(file, statusEl){
  const array = new Uint8Array(await file.arrayBuffer());
  statusEl.innerHTML = 'Opening PDF... <span class="spinner"></span>';
  const loadingTask = pdfjsLib.getDocument({data:array});
  const pdf = await loadingTask.promise;
  let fullText = '';
  for(let p=1;p<=pdf.numPages;p++){
    statusEl.innerHTML = `Reading page ${p}/${pdf.numPages} <span class="spinner"></span>`;
    const page = await pdf.getPage(p);
    const textContent = await page.getTextContent();
    const pageText = textContent.items.map(i=>i.str).join(' ');
    if(pageText && pageText.trim().length>20){
      fullText += pageText + '\n';
    } else {
      // rasterize and OCR
      statusEl.innerHTML = `OCR page ${p} (this may be slow) <span class="spinner"></span>`;
      const viewport = page.getViewport({scale:2});
      const canvas = document.createElement('canvas');
      canvas.width = Math.floor(viewport.width);
      canvas.height = Math.floor(viewport.height);
      const ctx = canvas.getContext('2d');
      await page.render({canvasContext:ctx, viewport}).promise;
      const { data: { text } } = await Tesseract.recognize(canvas, 'eng', { logger: m => {/* optional */} });
      fullText += text + '\n';
      canvas.remove();
    }
  }
  statusEl.innerText = 'PDF extraction complete';
  return fullText;
}

/* ============================
   Text -> tabular heuristics
   ============================ */

function textToLines(text){
  return text.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
}

function lineToColumns(line){
  // try split by tabs, then by 2+ spaces, then fallback to single spaces
  let cols = line.split(/\t+/).map(c=>c.trim()).filter(Boolean);
  if(cols.length<=1) cols = line.split(/ {2,}/).map(c=>c.trim()).filter(Boolean);
  if(cols.length<=1) cols = line.split(/\s{1,}/).map(c=>c.trim()).filter(Boolean);
  return cols;
}

function linesToRows(text){
  const lines = textToLines(text);
  const rows = lines.map(lineToColumns).filter(r=>r.length>0);
  return rows;
}

function detectHeaderRow(rows){
  const headerTerms = ['date','transaction','trans','value','posting','book','debit','credit','amount','dr','cr','narration','reference'];
  for(let i=0;i<Math.min(6,rows.length);i++){
    const joined = rows[i].join(' ').toLowerCase();
    let score = 0;
    headerTerms.forEach(t=> { if(joined.includes(t)) score++; });
    if(score >= 2) return i;
  }
  return -1;
}

function rowsToRecordsFromRows(rows, headerIndex){
  if(headerIndex>=0){
    const headers = rows[headerIndex].map(h=>String(h).trim());
    const dataRows = rows.slice(headerIndex+1);
    const records = dataRows.map(r=>{
      const obj = {};
      for(let i=0;i<headers.length;i++){
        obj[headers[i]||('col'+i)] = r[i] !== undefined ? r[i] : '';
      }
      return obj;
    });
    return {headers, records};
  } else {
    // No header row: attempt to make fixed-width columns by token index
    const maxCols = Math.max(...rows.map(r=>r.length));
    const headers = Array.from({length:maxCols},(_,i)=>'col'+i);
    const records = rows.map(r=>{
      const obj = {};
      for(let i=0;i<maxCols;i++) obj['col'+i] = r[i] || '';
      return obj;
    });
    return {headers, records};
  }
}

/* ============================
   Scoring based AI detection (data-driven)
   ============================ */

function scoreColumns(records, headers){
  // For each header key, compute scores for date-like and numeric-like
  const scores = {};
  headers.forEach(h=> scores[h] = {date:0, numeric:0, samples:0});
  const sampleN = Math.min(records.length, 20);
  for(let i=0;i<sampleN;i++){
    const r = records[i];
    headers.forEach(h=>{
      const v = r[h];
      if(v === undefined || v === null) return;
      const s = String(v).trim();
      if(!s) return;
      scores[h].samples++;
      if(tryParseDate(s)) scores[h].date++;
      const n = cleanNumeric(s);
      if(Math.abs(n) > 0) scores[h].numeric++;
    });
  }
  // compute confidence = score/samples
  const conf = headers.map(h=>{
    const s = scores[h];
    const dateConf = s.samples ? s.date / s.samples : 0;
    const numConf = s.samples ? s.numeric / s.samples : 0;
    return {header:h, dateConf, numConf, samples:s.samples};
  });
  return {scores, conf};
}

function pickBestColumns(conf, headerNames){
  // Choose date column: highest dateConf
  let dateCandidate = conf.slice().sort((a,b)=>b.dateConf - a.dateConf)[0];
  // Choose numeric columns: top two by numConf
  const numericCandidates = conf.slice().sort((a,b)=>b.numConf - a.numConf);
  let debitCandidate = numericCandidates[0] || null;
  let creditCandidate = numericCandidates[1] || null;

  // fallback heuristics using header words
  for(const c of conf){
    const low = c.header.toLowerCase();
    if(!dateCandidate || dateCandidate.dateConf < 0.5){
      if(/date|transaction|posting|value|book/.test(low)) { dateCandidate = c; }
    }
    if(!debitCandidate || debitCandidate.numConf < 0.5){
      if(/debit|dr|withdrawal|debitamount/.test(low)) debitCandidate = c;
    }
    if(!creditCandidate || creditCandidate.numConf < 0.5){
      if(/credit|cr|deposit|creditamount/.test(low)) creditCandidate = c;
    }
  }
  return {
    dateCol: dateCandidate ? dateCandidate.header : null,
    debitCol: debitCandidate ? debitCandidate.header : null,
    creditCol: creditCandidate ? creditCandidate.header : null,
    confidences: {dateConf: dateCandidate?dateCandidate.dateConf:0, debitConf: debitCandidate?debitCandidate.numConf:0, creditConf: creditCandidate?creditCandidate.numConf:0}
  };
}

/* ============================
   Excel/CSV sheet processing
   ============================ */

function processSheetJson(json){
  if(!json || !json.length) return {ok:false};
  const headers = Object.keys(json[0]).map(h=>String(h));
  // Simple header normalization attempt
  let dateKey=null, debitKey=null, creditKey=null;
  const normalize = s=>String(s||'').toLowerCase().replace(/[\s\/\\_\-\r\n]+/g,'');
  const dateWords = ['postingdate','bookdate','valuedate','transactiondate','transdate','date'];
  const debitWords = ['debit','debitamount','dr','withdrawal','debit amt','debit_amount'];
  const creditWords = ['credit','creditamount','cr','deposit','credit amt','credit_amount'];
  for(const k of headers){
    const nk = normalize(k);
    if(!dateKey && dateWords.some(w=>nk.includes(w))) dateKey=k;
    if(!debitKey && debitWords.some(w=>nk.includes(w))) debitKey=k;
    if(!creditKey && creditWords.some(w=>nk.includes(w))) creditKey=k;
  }
  // Build records
  const records = json.map(r=>{
    const rec = {};
    headers.forEach(h=> rec[h] = r[h]);
    return rec;
  });
  // If any missing, data-driven detection
  if(!dateKey || !debitKey || !creditKey){
    const {conf} = scoreColumns(records, headers);
    const pick = pickBestColumns(conf, headers);
    dateKey = dateKey || pick.dateCol;
    debitKey = debitKey || pick.debitCol;
    creditKey = creditKey || pick.creditCol;
  }
  if(!dateKey || !debitKey || !creditKey) return {ok:false};
  // Build month map
  const monthMap = {};
  const sampleRows = [];
  for(const r of records){
    const dt = tryParseDate(r[dateKey]);
    if(!dt) continue;
    const d = cleanNumeric(r[debitKey]);
    const c = cleanNumeric(r[creditKey]);
    const mk = `${dt.toLocaleString('default',{month:'long'})} ${dt.getFullYear()}`;
    if(!monthMap[mk]) monthMap[mk] = {Debit:0, Credit:0};
    monthMap[mk].Debit += d;
    monthMap[mk].Credit += c;
    if(sampleRows.length < 30) sampleRows.push({Date: dt.toISOString(),Debit:d,Credit:c});
  }
  return {ok:true, monthMap, sampleRows, detected: {dateKey, debitKey, creditKey}};
}

/* ============================
   PDF text processing -> rows -> detection
   ============================ */

function rowsFromText(text){
  const rows = linesToRows(text);
  const headerIdx = detectHeaderRow(rows);
  const {headers, records} = rowsToRecordsFromRows(rows, headerIdx);
  return {headers, records, headerIdx};
}

function rowsToRecords(rows){ // helper from rows array where rows[0] might be header
  const headerIdx = detectHeaderRow(rows);
  return rowsToRecordsFromRows(rows, headerIdx);
}

/* ============================
   Free-text fallback parser
   ============================ */

function parseFreeTextLines(text){
  // scan lines, look for a date and two numbers -> treat as record
  const lines = text.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  const monthMap = {};
  const sampleRows = [];
  const dateRegex = /(\d{1,2}[-\/ ](?:[A-Za-z]{3,9}|\d{1,2})[-\/ ]\d{2,4})|(\d{4}[-\/]\d{1,2}[-\/]\d{1,2})|([A-Za-z]{3,9}\s+\d{1,2},?\s*\d{4})/;
  for(const line of lines){
    const m = line.match(dateRegex);
    if(!m) continue;
    const dateStr = m[0];
    const dt = tryParseDate(dateStr);
    if(!dt) continue;
    // find numbers
    const nums = (line.replace(dateStr,' ')).match(/-?\(?\d{1,3}(?:[,\s]\d{3})*(?:\.\d+)?\)?/g);
    if(!nums || nums.length < 1) continue;
    // heuristic: use last two numbers
    const numbers = nums.map(n=>cleanNumeric(n));
    if(numbers.length === 1){
      // if only one number, treat as credit if 'deposit' appears else debit
      const n = numbers[0];
      const isDeposit = /deposit|received|payment/i.test(line);
      const mk = `${dt.toLocaleString('default',{month:'long'})} ${dt.getFullYear()}`;
      if(!monthMap[mk]) monthMap[mk] = {Debit:0, Credit:0};
      if(isDeposit) monthMap[mk].Credit += n; else monthMap[mk].Debit += n;
      if(sampleRows.length < 30) sampleRows.push({Date: dt.toISOString(),Debit: isDeposit?0:n,Credit: isDeposit?n:0});
    } else {
      const a = numbers[numbers.length-2], b = numbers[numbers.length-1];
      // heuristics using words
      let debit=0, credit=0;
      if(/deposit|received|credit/i.test(line)){ debit = a; credit = b; if(b < a){ debit = b; credit = a; } }
      else if(/withdraw|withdrawal|paid|transfer|debit/i.test(line)){ debit = a; credit = b; }
      else {
        // sign-based
        if(a < 0) debit = Math.abs(a), credit = b;
        else if(b < 0) debit = Math.abs(b), credit = a;
        else { debit = a; credit = b; }
      }
      const mk = `${dt.toLocaleString('default',{month:'long'})} ${dt.getFullYear()}`;
      if(!monthMap[mk]) monthMap[mk] = {Debit:0, Credit:0};
      monthMap[mk].Debit += debit;
      monthMap[mk].Credit += credit;
      if(sampleRows.length < 30) sampleRows.push({Date: dt.toISOString(),Debit:debit,Credit:credit, line});
    }
  }
  return {monthMap, sampleRows};
}

/* ============================
   Top-level handlers for file types
   ============================ */

async function handleExcelFile(file, statusEl){
  statusEl.innerText = 'Reading Excel/CSV...';
  const arr = await file.arrayBuffer();
  const workbook = XLSX.read(arr, {type:'array'});
  const combined = {};
  const sample = [];
  const detectedColumns = [];
  for(const sName of workbook.SheetNames){
    statusEl.innerText = `Processing sheet: ${sName}`;
    const sheet = workbook.Sheets[sName];
    const json = XLSX.utils.sheet_to_json(sheet, {defval:''});
    const res = processSheetJson(json);
    if(!res.ok) { continue; }
    Object.keys(res.monthMap).forEach(mk=>{
      if(!combined[mk]) combined[mk] = {Debit:0, Credit:0};
      combined[mk].Debit += res.monthMap[mk].Debit;
      combined[mk].Credit += res.monthMap[mk].Credit;
    });
    res.sampleRows.forEach(r=> sample.push(r));
    if(res.detected) detectedColumns.push({sheet:sName, ...res.detected});
  }
  return {monthMap: combined, sampleRows: sample, detectedColumns};
}

async function handlePDFFile(file, statusEl){
  statusEl.innerText = 'Extracting PDF text...';
  const text = await extractTextFromPDF(file, statusEl);
  statusEl.innerText = 'Parsing text into rows...';
  const rows = linesToRows(text);
  // attempt table extraction
  const hdrIdx = detectHeaderRow(rows);
  if(hdrIdx >= 0){
    const {headers, records} = rowsToRecordsFromRows(rows, hdrIdx);
    const det = detectDateDebitCreditFromRecords(records, headers);
  }
  // First try structured rows approach
  const {headers, records} = rowsToRecordsFromRows(rows, detectHeaderRow(rows));
  // Score columns
  const scoreRes = scoreColumns(records, headers);
  const pick = pickBestColumns(scoreRes.conf, headers);
  if(pick.dateCol && pick.debitCol && pick.creditCol && (pick.confidences.dateConf + pick.confidences.debitConf + pick.confidences.creditConf) > 0.5){
    // Build monthMap from records
    const monthMap = {};
    const sampleRows = [];
    for(const rec of records){
      const dt = tryParseDate(rec[pick.dateCol]);
      if(!dt) continue;
      const d = cleanNumeric(rec[pick.debitCol]);
      const c = cleanNumeric(rec[pick.creditCol]);
      const mk = `${dt.toLocaleString('default',{month:'long'})} ${dt.getFullYear()}`;
      if(!monthMap[mk]) monthMap[mk] = {Debit:0, Credit:0};
      monthMap[mk].Debit += d;
      monthMap[mk].Credit += c;
      if(sampleRows.length < 30) sampleRows.push({Date:dt.toISOString(),Debit:d,Credit:c});
    }
    return {monthMap, sampleRows, detected: pick};
  }
  // fallback to free-text extraction
  const fallback = parseFreeTextLines(text);
  return fallback;
}

// helper used above in PDF path
function detectDateDebitCreditFromRecords(records, headers){
  const res = scoreColumns(records, headers);
  return pickBestColumns(res.conf, headers);
}

/* ============================
   UI wiring & main flow
   ============================ */

const fileInput = document.getElementById('fileInput');
const analyzeBtn = document.getElementById('analyzeBtn');
const exportBtn = document.getElementById('exportBtn');
const statusEl = document.getElementById('status');
const tableOutput = document.getElementById('tableOutput');
const rawOutput = document.getElementById('rawOutput');
const summaryCard = document.getElementById('summaryCard');
const rawCard = document.getElementById('rawCard');
const mappingUI = document.getElementById('mappingUI');
const dateSelect = document.getElementById('dateSelect');
const debitSelect = document.getElementById('debitSelect');
const creditSelect = document.getElementById('creditSelect');
const aiMode = document.getElementById('aiMode');
const confThresh = document.getElementById('confThresh');
const mappingDiv = document.getElementById('mappingUI');

let lastSummary = [];
let lastDetected = null;
let currentHeaders = [];

function renderCharts(months, debit, credit){
  const ctxB = document.getElementById('barChart');
  const ctxP = document.getElementById('pieChart');
  if(window._chartBar) window._chartBar.destroy();
  if(window._chartPie) window._chartPie.destroy();
  window._chartBar = new Chart(ctxB.getContext('2d'), {
    type:'bar',
    data:{ labels:months, datasets:[
      {label:'Debit', data:debit, backgroundColor:'#ff6384'},
      {label:'Credit', data:credit, backgroundColor:'#36a2eb'}
    ]},
    options:{responsive:true, plugins:{legend:{position:'top'}}, scales:{x:{stacked:true}, y:{stacked:true}}}
  });
  window._chartPie = new Chart(ctxP.getContext('2d'), {
    type:'pie',
    data:{ labels:['Total Debit','Total Credit'], datasets:[{ data:[debit.reduce((a,b)=>a+b,0), credit.reduce((a,b)=>a+b,0)], backgroundColor:['#ff6384','#36a2eb'] }]},
    options:{responsive:true}
  });
}

function showMappingOptions(headers, detected){
  mappingDiv.style.display = 'flex';
  dateSelect.innerHTML = '';
  debitSelect.innerHTML = '';
  creditSelect.innerHTML = '';
  currentHeaders = headers || [];
  headers.forEach(h=>{
    const opt1 = document.createElement('option'); opt1.value = h; opt1.text = h; dateSelect.appendChild(opt1);
    const opt2 = document.createElement('option'); opt2.value = h; opt2.text = h; debitSelect.appendChild(opt2);
    const opt3 = document.createElement('option'); opt3.value = h; opt3.text = h; creditSelect.appendChild(opt3);
  });
  if(detected){
    if(detected.dateCol) dateSelect.value = detected.dateCol;
    if(detected.debitCol) debitSelect.value = detected.debitCol;
    if(detected.creditCol) creditSelect.value = detected.creditCol;
  }
}

analyzeBtn.addEventListener('click', async ()=>{
  const f = fileInput.files[0];
  const name = (document.getElementById('statementName').value.trim()) || (f && f.name) || 'statement';
  if(!f){ alert('Please choose a file first'); return; }
  statusEl.innerHTML = '<span class="spinner"></span> Starting analysis';
  summaryCard.style.display = 'none';
  rawCard.style.display = 'none';
  mappingDiv.style.display = 'none';
  lastSummary = []; lastDetected = null; currentHeaders = [];
  try{
    let res;
    if(f.type === 'application/pdf' || f.name.toLowerCase().endsWith('.pdf')){
      res = await handlePDFFile(f, statusEl);
    } else {
      res = await handleExcelFile(f, statusEl);
    }
    if(!res || !res.monthMap || Object.keys(res.monthMap).length === 0){
      statusEl.innerText = 'No recognizable data found';
      return;
    }
    // generate months sorted
    const months = Object.keys(res.monthMap).sort((a,b)=> new Date(a) - new Date(b));
    // prepare table
    let html = `<div style="display:flex;gap:12px;align-items:center"><div class="muted small">File:</div><div style="font-weight:700">${name}</div></div>`;
    html += '<div style="margin-top:10px"><table><thead><tr><th>S/N</th><th>Month</th><th>Debit</th><th>Credit</th><th>Net</th></tr></thead><tbody>';
    let totD=0, totC=0;
    lastSummary = [];
    months.forEach((m,i)=>{
      const d = res.monthMap[m].Debit || 0;
      const c = res.monthMap[m].Credit || 0;
      const net = c - d;
      totD += d; totC += c;
      html += `<tr><td>${i+1}</td><td>${m}</td><td>${d.toFixed(2)}</td><td>${c.toFixed(2)}</td><td>${net.toFixed(2)}</td></tr>`;
      lastSummary.push({SNo:i+1, Month:m, Debit:d, Credit:c, Net:net});
    });
    html += `<tr style="font-weight:700"><td colspan="2">Grand Total</td><td>${totD.toFixed(2)}</td><td>${totC.toFixed(2)}</td><td>${(totC-totD).toFixed(2)}</td></tr>`;
    html += '</tbody></table></div>';
    tableOutput.innerHTML = html;
    summaryCard.style.display = 'block';
    // sample rows
    if(res.sampleRows && res.sampleRows.length){
      rawCard.style.display = 'block';
      rawOutput.innerHTML = '<pre>' + JSON.stringify(res.sampleRows.slice(0,30),null,2) + '</pre>';
    } else {
      rawCard.style.display = 'none';
    }
    // render charts
    renderCharts(months, months.map(m=>res.monthMap[m].Debit || 0), months.map(m=>res.monthMap[m].Credit || 0));
    statusEl.innerText = 'Analysis complete';
    // detection assistance if AI Mode wants mapping
    const mode = aiMode.value;
    // if the result included detected columns, and user requested assist, show mapping
    if(mode !== 'auto'){
      // prepare headers list if available
      const headerList = (res.detected && res.detected.headers) ? res.detected.headers : (res.detectedColumns ? [].concat(...res.detectedColumns.map(d=>Object.values(d))) : []);
      // fallback: try to build header list from sampleRows keys
    }
    // show mapping dropdowns if assist or manual
    if(mode === 'assist' || mode === 'manual'){
      // build header options from either res.detectedColumns or sampleRows keys
      let headers = [];
      if(res.detected && res.detected.dateCol) {
        headers = [res.detected.dateCol, res.detected.debitCol, res.detected.creditCol];
      } else if(res.detectedColumns && res.detectedColumns.length){
        headers = Object.values(res.detectedColumns[0]).filter(Boolean);
      } else {
        // try from sampleRows keys
        if(res.sampleRows && res.sampleRows.length){
          headers = Object.keys(res.sampleRows[0]).map(k=>k);
        }
      }
      // unify & unique
      headers = Array.from(new Set(headers.filter(Boolean)));
      if(headers.length){
        currentHeaders = headers;
        showMappingOptions(headers, res.detected || null);
      } else {
        // As last resort, create select items from the first sheet's raw column names if Excel
        // For simplicity, try to populate with Month/Date/col0..colN
        const fallbackHeaders = [];
        for(let i=0;i<8;i++) fallbackHeaders.push('col'+i);
        currentHeaders = fallbackHeaders;
        showMappingOptions(fallbackHeaders, null);
      }
    }
    lastDetected = res.detected || null;
  }catch(err){
    console.error(err);
    statusEl.innerText = 'Error: '+(err.message||err);
  }
});

// When user applies manual mapping
document.getElementById('applyMapping').addEventListener('click', async ()=>{
  // If manual mapping applied, we need to re-aggregate using chosen columns
  const dateCol = dateSelect.value;
  const debitCol = debitSelect.value;
  const creditCol = creditSelect.value;
  if(!dateCol || !debitCol || !creditCol){ alert('Select all three columns'); return; }
  statusEl.innerHTML = 'Applying mapping and re-aggregating... <span class="spinner"></span>';
  // We will reprocess last uploaded file using chosen headers heuristically.
  // Approach: read file again and attempt to use these column names/indexes.
  const f = fileInput.files[0];
  if(!f){ alert('No file'); return; }
  try{
    let res;
    if(f.type==='application/pdf' || f.name.toLowerCase().endsWith('.pdf')){
      // For PDFs, manual mapping may be hard. We'll fallback to parsing lines and using index or header names.
      const text = await extractTextFromPDF(f, statusEl);
      const rows = linesToRows(text);
      const headerIdx = detectHeaderRow(rows);
      const {headers, records} = rowsToRecordsFromRows(rows, headerIdx);
      // If chosen names are numeric col names like col0.., support that.
      const chosen = {dateCol, debitCol, creditCol};
      // Build monthMap
      const monthMap = {};
      const sample = [];
      for(const rec of records){
        const dt = tryParseDate(rec[dateCol] || rec[dateCol]===0? rec[dateCol] : rec[dateCol]);
        if(!dt) continue;
        const d = cleanNumeric(rec[debitCol]);
        const c = cleanNumeric(rec[creditCol]);
        const mk = `${dt.toLocaleString('default',{month:'long'})} ${dt.getFullYear()}`;
        if(!monthMap[mk]) monthMap[mk] = {Debit:0, Credit:0};
        monthMap[mk].Debit += d;
        monthMap[mk].Credit += c;
        if(sample.length < 30) sample.push({Date: dt.toISOString(),Debit:d,Credit:c});
      }
      res = {monthMap, sampleRows: sample};
    } else {
      // Excel: load workbook and try to map header names directly
      const arr = await f.arrayBuffer();
      const workbook = XLSX.read(arr, {type:'array'});
      const combined = {}; const sample = [];
      for(const sName of workbook.SheetNames){
        const sheet = workbook.Sheets[sName];
        const json = XLSX.utils.sheet_to_json(sheet, {defval:''});
        if(!json || !json.length) continue;
        // Try to map by header name; if not found, allow numeric index like col0..colN
        const keys = Object.keys(json[0]);
        // If chosen values are in keys use them, else interpret 'colN' as index
        const mapKey = key => {
          if(keys.includes(key)) return key;
          if(/^col\d+$/.test(key)){
            const idx = parseInt(key.replace('col',''),10);
            return keys[idx] || null;
          }
          // try fuzzy match
          const norm = key.toLowerCase().replace(/[\s\/\\_\-]+/g,'');
          const found = keys.find(k=>k.toLowerCase().replace(/[\s\/\\_\-]+/g,'').includes(norm));
          return found || null;
        };
        const dKey = mapKey(dateCol);
        const drKey = mapKey(debitCol);
        const crKey = mapKey(creditCol);
        if(!dKey || !drKey || !crKey) continue;
        for(const r of json){
          const dt = tryParseDate(r[dKey]);
          if(!dt) continue;
          const d = cleanNumeric(r[drKey]);
          const c = cleanNumeric(r[crKey]);
          const mk = `${dt.toLocaleString('default',{month:'long'})} ${dt.getFullYear()}`;
          if(!combined[mk]) combined[mk] = {Debit:0, Credit:0};
          combined[mk].Debit += d; combined[mk].Credit += c;
          if(sample.length < 30) sample.push({Date: dt.toISOString(),Debit:d,Credit:c});
        }
      }
      res = {monthMap: combined, sampleRows: sample};
    }

    if(!res || !res.monthMap || Object.keys(res.monthMap).length===0){
      statusEl.innerText = 'Mapping applied but no recognizable data found with chosen columns';
      return;
    }
    // render results
    const months = Object.keys(res.monthMap).sort((a,b)=> new Date(a) - new Date(b));
    let html = `<div style="display:flex;gap:12px;align-items:center"><div class="muted small">Mapping applied</div></div>`;
    html += '<div style="margin-top:10px"><table><thead><tr><th>S/N</th><th>Month</th><th>Debit</th><th>Credit</th><th>Net</th></tr></thead><tbody>';
    let totD=0, totC=0; lastSummary=[];
    months.forEach((m,i)=>{
      const d = res.monthMap[m].Debit || 0;
      const c = res.monthMap[m].Credit || 0;
      const net = c - d; totD+=d; totC+=c;
      html += `<tr><td>${i+1}</td><td>${m}</td><td>${d.toFixed(2)}</td><td>${c.toFixed(2)}</td><td>${net.toFixed(2)}</td></tr>`;
      lastSummary.push({SNo:i+1, Month:m, Debit:d, Credit:c, Net:net});
    });
    html += `<tr style="font-weight:700"><td colspan="2">Grand Total</td><td>${totD.toFixed(2)}</td><td>${totC.toFixed(2)}</td><td>${(totC-totD).toFixed(2)}</td></tr>`;
    html += '</tbody></table></div>';
    tableOutput.innerHTML = html;
    summaryCard.style.display = 'block';
    rawCard.style.display = res.sampleRows && res.sampleRows.length ? 'block' : 'none';
    rawOutput.innerHTML = res.sampleRows && res.sampleRows.length ? '<pre>' + JSON.stringify(res.sampleRows.slice(0,30),null,2) + '</pre>' : '';
    renderCharts(months, months.map(m=>res.monthMap[m].Debit||0), months.map(m=>res.monthMap[m].Credit||0));
    statusEl.innerText = 'Mapping applied — done';
  }catch(e){
    console.error(e);
    statusEl.innerText = 'Error applying mapping: '+(e.message||e);
  }
});

// Export
exportBtn.addEventListener('click', ()=>{
  if(!lastSummary || !lastSummary.length){ alert('No summary to export'); return; }
  const ws = XLSX.utils.json_to_sheet(lastSummary);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Monthly Summary');
  XLSX.writeFile(wb, 'Monthly_Bank_Summary.xlsx');
});
