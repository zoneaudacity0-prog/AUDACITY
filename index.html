<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AI Financial Analysis Agent</title>
  <style>
    body {
      font-family: Arial;
      background: #f3f4f6;
      padding: 30px;
    }
    .container {
      max-width: 700px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    }
    #resultBox {
      margin-top: 20px;
      background: #f9fafb;
      padding: 20px;
      border-radius: 8px;
      display: none;
    }
    button {
      background: #2563eb;
      color: white;
      padding: 12px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
    }
    button:hover { background: #1e40af; }
  </style>
</head>

<body>
  <div class="container">
    <h2>AI Financial Analysis Agent</h2>
    <p>Upload PDF / Excel / CSV and get instant financial insights.</p>

    <input type="file" id="fileInput"><br><br>
    <button onclick="uploadFile()">Analyze</button>

    <div id="resultBox"></div>
  </div>

<script>
function uploadFile() {
    let fileInput = document.getElementById("fileInput");
    if (!fileInput.files.length) {
        alert("Please upload a file");
        return;
    }

    let formData = new FormData();
    formData.append("file", fileInput.files[0]);

    let box = document.getElementById("resultBox");
    box.style.display = "block";
    box.innerHTML = "Analyzing… Please wait.";

    fetch("http://localhost:8000/analyze-file", {
        method: "POST",
        body: formData
    })
    .then(res => res.json())
    .then(data => {
        box.innerHTML = "<h3>Analysis Result</h3><pre>" + JSON.stringify(data, null, 2) + "</pre>";
    })
    .catch(err => {
        box.innerHTML = "❌ Error: " + err;
    });
}
</script>
</body>
</html>
