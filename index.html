<script>
let barChartInstance, pieChartInstance;

async function analyzeStatement() {
  const fileInput = document.getElementById('fileInput');
  const statementName = document.getElementById('statementName').value.trim();
  const output = document.getElementById('output');

  if (!fileInput.files.length) {
    output.textContent = "Please select a file to analyze.";
    return;
  }
  if (!statementName) {
    output.textContent = "Please enter a name for your statement.";
    return;
  }

  const file = fileInput.files[0];
  output.textContent = `Analyzing "${statementName}"...\n\n`;

  let transactions = [];
  try {
    if (file.name.endsWith(".csv") || file.name.endsWith(".xls") || file.name.endsWith(".xlsx")) {
      const data = await file.arrayBuffer();
      const workbook = XLSX.read(data);
      const sheetName = workbook.SheetNames[0];
      const sheet = workbook.Sheets[sheetName];
      const json = XLSX.utils.sheet_to_json(sheet, { defval: 0 });
      transactions = json;

      output.textContent += `First 5 rows of ${json.length} total rows:\n`;
      output.textContent += JSON.stringify(json.slice(0,5), null, 2);

      // Summaries
      let debitTotal = 0, creditTotal = 0;
      const monthlySummary = {};

      json.forEach(row => {
        let date = row.Date ? new Date(row.Date) : null;

        // Parse Debit/Credit as float safely
        const debit = parseFloat(row.Debit) || 0;
        const credit = parseFloat(row.Credit) || 0;

        debitTotal += debit;
        creditTotal += credit;

        if (date) {
          const monthKey = `${date.getFullYear()}-${("0"+(date.getMonth()+1)).slice(-2)}`;
          if (!monthlySummary[monthKey]) monthlySummary[monthKey] = { Debit:0, Credit:0 };
          monthlySummary[monthKey].Debit += debit;
          monthlySummary[monthKey].Credit += credit;
        }
      });

      output.textContent += `\nTotal Debit: ${debitTotal}\nTotal Credit: ${creditTotal}\n`;
      output.textContent += `\nMonthly Summary:\n${JSON.stringify(monthlySummary, null, 2)}\n`;

      renderCharts(monthlySummary, debitTotal, creditTotal);

    } else if (file.name.endsWith(".pdf")) {
      const pdfData = await file.arrayBuffer();
      const pdf = await pdfjsLib.getDocument({ data: pdfData }).promise;
      let pdfText = "";

      for (let i = 1; i <= Math.min(pdf.numPages, 3); i++) {
        const page = await pdf.getPage(i);
        const content = await page.getTextContent();
        const strings = content.items.map(item => item.str);
        pdfText += strings.join(" ") + "\n";
      }

      output.textContent += pdfText;
      output.textContent += `[Extracted text from first 3 pages]\n`;
    } else {
      output.textContent += "Unsupported file type.";
    }
  } catch (err) {
    output.textContent += `Error analyzing file: ${err.message}`;
  }
}

function renderCharts(monthlySummary, totalDebit, totalCredit) {
  const months = Object.keys(monthlySummary).sort();
  const debitData = months.map(m => monthlySummary[m].Debit);
  const creditData = months.map(m => monthlySummary[m].Credit);

  const barCtx = document.getElementById('barChart').getContext('2d');
  if (barChartInstance) barChartInstance.destroy();
  barChartInstance = new Chart(barCtx, {
    type: 'bar',
    data: {
      labels: months,
      datasets: [
        { label: 'Debit', data: debitData, backgroundColor: '#ff6384' },
        { label: 'Credit', data: creditData, backgroundColor: '#36a2eb' }
      ]
    },
    options: { responsive: true, plugins: { legend: { position: 'top' } } }
  });

  const pieCtx = document.getElementById('pieChart').getContext('2d');
  if (pieChartInstance) pieChartInstance.destroy();
  pieChartInstance = new Chart(pieCtx, {
    type: 'pie',
    data: {
      labels: ['Total Debit', 'Total Credit'],
      datasets: [{ data: [totalDebit, totalCredit], backgroundColor: ['#ff6384','#36a2eb'] }]
    },
    options: { responsive: true }
  });
}
</script>
